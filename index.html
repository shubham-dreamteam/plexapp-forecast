/* ============================================================
   Shared building blocks for the live record views
   ============================================================ */
const STAGE_COLOR = {
  Prospecting: 'var(--c-pipe)', Pitch: 'var(--c-pipe)', Proposal: 'var(--c-best)',
  Negotiation: '#8b5cf6', 'Closed - Lost': 'var(--c-risk)', 'Closed - Won': 'var(--c-commit)',
};
const stageColor = (s) => STAGE_COLOR[s] || 'var(--text-3)';

function StageChip({ stage }) {
  const c = stageColor(stage);
  return (
    <span className="stage-chip" style={{ background: `color-mix(in srgb, ${c} 15%, transparent)`, color: c }}>
      <span className="dot" style={{ background: c }}></span>{stage}
    </span>
  );
}

function ProbBar({ value }) {
  const c = value >= 80 ? 'var(--c-commit)' : value >= 50 ? 'var(--c-best)' : 'var(--c-pipe)';
  return (
    <span className="row" style={{ gap: 8, justifyContent: 'flex-end' }}>
      <span className="pbar"><span style={{ width: value + '%', background: c }}></span></span>
      <span className="mono" style={{ fontSize: 12.5, color: 'var(--text-2)', width: 30, textAlign: 'right' }}>{value}%</span>
    </span>
  );
}

function useSort(initialKey, initialDir = 'desc') {
  const [key, setKey] = React.useState(initialKey);
  const [dir, setDir] = React.useState(initialDir);
  const onSort = (k) => { if (k === key) setDir(d => d === 'desc' ? 'asc' : 'desc'); else { setKey(k); setDir('desc'); } };
  const sorter = (a, b) => {
    let av = a[key], bv = b[key];
    if (typeof av === 'string' || typeof bv === 'string') {
      av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase();
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = av || 0; bv = bv || 0; return dir === 'asc' ? av - bv : bv - av;
  };
  return { key, dir, onSort, sorter };
}

function SortableHead({ sortKey, label, cls, sort }) {
  return (
    <th className={'sort ' + (cls || '')} onClick={() => sort.onSort(sortKey)}>
      {label}{sort.key === sortKey && <span className="caret">{sort.dir === 'asc' ? '▲' : '▼'}</span>}
    </th>
  );
}

/* ---- the universal drill-down dialog ---- */
/* Optional drill-table columns the viewer can add. Flight dates are always shown;
   these are the extras. The choice sticks (localStorage) across drills & visits. */
const DRILL_OPT_COLS = [
  { key: 'created', label: 'Created',        sortKey: 'createdDate', render: d => d.createdDate || '—' },
  { key: 'partner', label: 'Partner agency', sortKey: 'partner',     render: d => d.partner || '—' },
  { key: 'owner',   label: 'Owner',          sortKey: 'owner',       render: d => d.owner || '—' },
  { key: 'channel', label: 'Channel',        sortKey: 'channel',     render: d => d.channel || '—' },
  { key: 'type',    label: 'Type',           sortKey: 'dealType',    render: d => d.dealType || '—' },
];

function DrillModal({ drill, onClose }) {
  const [cols, setCols] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('plex_drill_cols') || '[]'); } catch (e) { return []; }
  });
  const toggleCol = (k) => setCols(prev => {
    const next = prev.includes(k) ? prev.filter(x => x !== k) : [...prev, k];
    try { localStorage.setItem('plex_drill_cols', JSON.stringify(next)); } catch (e) {}
    return next;
  });
  const sort = useSort('weighted', 'desc');
  React.useEffect(() => {
    if (!drill) return;
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, [drill, onClose]);
  if (!drill) return null;

  const deals = (drill.deals || []).slice().sort(sort.sorter);
  const sum = deals.reduce((a, d) => ({ amt: a.amt + (d.amount || 0), wtd: a.wtd + (d.weighted || 0) }), { amt: 0, wtd: 0 });
  const single = deals.length === 1 ? deals[0] : null;
  const active = DRILL_OPT_COLS.filter(c => cols.includes(c.key));
  const flightOf = (d) => d.flightStart ? `${d.flightStart} → ${d.flightEnd || '?'}` : '—';

  return (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true">
        <div className="modal-head">
          <div>
            <div className="modal-eyebrow">{drill.eyebrow || 'Breakdown'}</div>
            <h3 className="modal-title">{drill.title}</h3>
            {drill.subtitle && <div className="modal-sub">{drill.subtitle}</div>}
          </div>
          <button className="modal-x" onClick={onClose} aria-label="Close"><Icon name="close" size={17} /></button>
        </div>
        <div className="modal-stats">
          <div className="mstat"><div className="ms-lab">Deals</div><div className="ms-val num">{deals.length}</div></div>
          <div className="mstat"><div className="ms-lab">Amount Σ</div><div className="ms-val num">{fmt.money(sum.amt)}</div></div>
          <div className="mstat"><div className="ms-lab">Weighted Σ</div><div className="ms-val num">{fmt.money(sum.wtd)}</div></div>
          {single && <div className="mstat"><div className="ms-lab">Win probability</div><div className="ms-val num">{single.probability}%</div></div>}
          {single && <div className="mstat"><div className="ms-lab">Owner</div><div className="ms-val num" style={{ fontSize: 15 }}>{single.owner}</div></div>}
          {(drill.extraStats || []).map((s, i) => <div className="mstat" key={i}><div className="ms-lab">{s.label}</div><div className="ms-val num">{s.value}</div></div>)}
        </div>
        {drill.note && <div className="modal-note">{drill.note}</div>}
        <div className="colpick">
          <span className="cp-lab">Add to view</span>
          {DRILL_OPT_COLS.map(c => (
            <button key={c.key} className={cols.includes(c.key) ? 'on' : ''} onClick={() => toggleCol(c.key)}>
              {cols.includes(c.key) ? '✓ ' : '+ '}{c.label}
            </button>
          ))}
        </div>
        <div className="modal-body">
          <table className="tbl">
            <thead><tr>
              <SortableHead sortKey="name" label="Deal" sort={sort} />
              <SortableHead sortKey="account" label="Account" sort={sort} />
              <SortableHead sortKey="stage" label="Stage" sort={sort} />
              <SortableHead sortKey="amount" label="Amount" cls="r" sort={sort} />
              <SortableHead sortKey="probability" label="Win %" cls="r" sort={sort} />
              <SortableHead sortKey="weighted" label="Weighted" cls="r" sort={sort} />
              <SortableHead sortKey="closeDate" label="Close date" sort={sort} />
              <SortableHead sortKey="flightStart" label="Flight" sort={sort} />
              {active.map(c => <SortableHead key={c.key} sortKey={c.sortKey} label={c.label} sort={sort} />)}
            </tr></thead>
            <tbody>
              {deals.map(d => (
                <tr key={d.id}>
                  <td style={{ fontWeight: 600, maxWidth: 220 }}>{d.name}</td>
                  <td className="muted">{d.account}</td>
                  <td><StageChip stage={d.stage} /></td>
                  <td className="r mono">{fmt.money(d.amount)}</td>
                  <td className="r mono">{d.probability}%</td>
                  <td className="r mono" style={{ fontWeight: 700 }}>{fmt.money(d.weighted)}</td>
                  <td className="muted mono" style={{ fontSize: 12 }}>{d.closeDate || '—'}</td>
                  <td className="muted mono" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{flightOf(d)}</td>
                  {active.map(c => <td key={c.key} className="muted" style={{ fontSize: 12.5 }}>{c.render(d)}</td>)}
                </tr>
              ))}
              {deals.length === 0 && <tr><td colSpan={8 + active.length} className="faint" style={{ textAlign: 'center', padding: 28 }}>No underlying deals for this metric.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ---- kanban board by stage (used by Pipeline page) ---- */
function KanbanBoard({ deals }) {
  const open = deals.filter(d => d.open);
  const stages = [];
  for (const d of open) if (!stages.includes(d.stage)) stages.push(d.stage);
  const order = ['Prospecting', 'Pitch', 'Proposal', 'Negotiation'];
  stages.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return (
    <div className="kanban">
      {stages.map(st => {
        const cards = open.filter(d => d.stage === st).sort((a, b) => b.amount - a.amount);
        const sum = cards.reduce((s, d) => s + d.amount, 0);
        const c = stageColor(st);
        return (
          <div className="kcol" key={st}>
            <div className="kcol-head">
              <span className="t"><span className="dot" style={{ width: 8, height: 8, borderRadius: 9, background: c, display: 'inline-block' }}></span>{st}</span>
              <span className="v">{cards.length} · {fmt.money(sum)}</span>
            </div>
            {cards.map(d => (
              <div className="kcard clickable" key={d.id} style={{ borderLeft: `3px solid ${c}` }}
                onClick={() => window.openDrill({ eyebrow: 'Deal', title: d.name, subtitle: `${d.account} · ${d.stage} · ${d.partner}`, deals: [d], extraStats: [{ label: 'Close', value: d.closeDate || '—' }] })}>
                <div className="nm">{d.name}</div>
                <div className="meta">
                  <span>{d.probability}% · {d.partner}</span>
                  <span className="amt">{fmt.money(d.amount)}</span>
                </div>

/* ---- per-deal revenue-recognition TIMELINE (horizontal) ----
   A FY2026 date axis: faint quarter bands, a green gradient "recognition
   window" spanning the flight dates (its width inside each quarter = that
   quarter's share of revenue), and a dark marker showing the close date.
   Tells the "closed on X, revenue recognized across this window" story. */
const FY_START = Date.UTC(2026, 0, 1);
const FY_END = Date.UTC(2026, 11, 31);
function parseUTC(s) { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); if (!y) return null; return Date.UTC(y, m - 1, d); }
function RecognitionTimeline({ closeDate, flightStart, flightEnd, value = 1 }) {
  const W = 248, H = 44, padL = 8, padR = 8, plotW = W - padL - padR, baseY = 22;
  const span = FY_END - FY_START;
  const xOf = (ms) => padL + (Math.max(FY_START, Math.min(FY_END, ms)) - FY_START) / span * plotW;
  const fs = parseUTC(flightStart), fe = parseUTC(flightEnd), cl = parseUTC(closeDate);

  // recognition window: flight dates if present, else the close-date quarter
  let ws = null, we = null, fallback = false;
  if (fs != null && fe != null && fe >= fs) { ws = fs; we = fe; }
  else if (cl != null) {
    const q = Math.min(3, Math.max(0, Math.floor(new Date(cl).getUTCMonth() / 3)));
    const yr = new Date(cl).getUTCFullYear();
    if (yr === 2026) { ws = Date.UTC(2026, q * 3, 1); we = Date.UTC(2026, q * 3 + 3, 0); fallback = true; }
  }
  const qDiv = [Date.UTC(2026, 3, 1), Date.UTC(2026, 6, 1), Date.UTC(2026, 9, 1)].map(xOf);
  const edges = [padL, ...qDiv, W - padR];
  const qMid = [0, 1, 2, 3].map(i => (edges[i] + edges[i + 1]) / 2);

  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ pointerEvents: 'none', display: 'block', margin: '0 auto' }}>
      {/* full-year track */}
      <rect x={padL} y={baseY - 4} width={plotW} height={8} rx={4} fill="var(--track)" opacity="0.5" />
      {/* quarter divider ticks */}
      {qDiv.map((x, i) => <line key={i} x1={x} y1={baseY - 8} x2={x} y2={baseY + 8} stroke="var(--border)" strokeWidth="1" strokeDasharray="2 2" />)}
      {/* recognition window — green gradient when revenue is recognized, faint hollow when $0 */}
      {ws != null && (value > 0
        ? <rect x={xOf(ws)} y={baseY - 5} width={Math.max(3, xOf(we) - xOf(ws))} height={10} rx={5}
            fill="url(#recGrad)" stroke="var(--c-commit)" strokeWidth="0.75" strokeOpacity={fallback ? 0.45 : 0.9}
            strokeDasharray={fallback ? '3 2' : 'none'} />
        : <rect x={xOf(ws)} y={baseY - 5} width={Math.max(3, xOf(we) - xOf(ws))} height={10} rx={5}
            fill="none" stroke="var(--text-3)" strokeWidth="0.75" strokeOpacity="0.5" strokeDasharray="2 2" />
      )}
      {/* window endpoint caps — a marker at the start AND the end of the recognition window */}
      {ws != null && value > 0 && (
        <g>
          <circle cx={xOf(ws)} cy={baseY} r="2.8" fill="var(--c-commit)" />
          <circle cx={xOf(we)} cy={baseY} r="2.8" fill="var(--c-commit)" />
        </g>
      )}
      {/* close / expected-close-date marker (dark dot above the axis) */}
      {cl != null && (
        <g>
          <line x1={xOf(cl)} y1={baseY - 15} x2={xOf(cl)} y2={baseY + 6} stroke="var(--text-2)" strokeWidth="1" strokeDasharray="2 2" />
          <circle cx={xOf(cl)} cy={baseY - 15} r="3.2" fill="var(--text)" stroke="var(--card)" strokeWidth="1" />
        </g>
      )}
      {/* quarter labels */}
      {['Q1', 'Q2', 'Q3', 'Q4'].map((q, i) => (
        <text key={q} x={qMid[i]} y={H - 3} textAnchor="middle" fontSize="8" fill="var(--text-3)" fontFamily="var(--font-mono)">{q}</text>
      ))}
    </svg>
  );
}

/* ---- per-deal quarterly forecast allocation table (Forecast page) ---- */
function DealQuarterTable({ deals }) {
  const rows = (deals || []).filter(d => d.open).slice()
    .sort((a, b) => b.weighted - a.weighted);
  const A = (d, q) => (d.alloc && d.alloc[q]) || 0;
  const tot = rows.reduce((t, d) => ({
    amt: t.amt + d.amount, w: t.w + d.weighted,
    Q1: t.Q1 + A(d, 'Q1'), Q2: t.Q2 + A(d, 'Q2'), Q3: t.Q3 + A(d, 'Q3'), Q4: t.Q4 + A(d, 'Q4'),
  }), { amt: 0, w: 0, Q1: 0, Q2: 0, Q3: 0, Q4: 0 });
  const D$ = (n) => n ? fmt.moneyFull(n) : <span className="faint">·</span>;
  return (
    <Panel title="Forecast by deal" sub="Weighted value (amount × win probability) prorated across quarters by flight-day overlap · click a row to drill">
      <svg width="0" height="0" style={{ position: 'absolute' }} aria-hidden="true">
        <defs>
          <linearGradient id="recGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stopColor="var(--c-commit)" stopOpacity="0.30" />
            <stop offset="1" stopColor="var(--c-commit)" stopOpacity="0.92" />
          </linearGradient>
        </defs>
      </svg>
      <div className="dt-wrap">
        <table className="tbl tbl-fc">
          <thead><tr>
            <th>Deal</th>
            <th className="r">Amount</th>
            <th className="r">Win %</th>
            <th>Close date</th>
            <th>Flight start</th>
            <th>Flight end</th>
            <th className="r">Q1</th><th className="r">Q2</th><th className="r">Q3</th><th className="r">Q4</th>
            <th style={{ textAlign: 'center' }}>Recognition</th>
          </tr></thead>
          <tbody>
            {rows.map(d => (
              <tr key={d.id} className="clickrow"
                onClick={() => window.openDrill({ eyebrow: 'Deal', title: d.name, subtitle: `${d.account} · ${d.stage} · ${d.partner}`, deals: [d], extraStats: [{ label: 'Close', value: d.closeDate || '—' }, { label: 'Flight', value: (d.flightStart || '—') + ' → ' + (d.flightEnd || '—') }] })}>
                <td style={{ fontWeight: 600, maxWidth: 190 }}>{d.name}</td>
                <td className="r mono">{fmt.moneyFull(d.amount)}</td>
                <td className="r mono">{d.probability}%</td>
                <td className="muted mono" style={{ fontSize: 12 }}>{d.closeDate || '—'}</td>
                <td className="muted mono" style={{ fontSize: 12 }}>{d.flightStart || '—'}</td>
                <td className="muted mono" style={{ fontSize: 12 }}>{d.flightEnd
                  ? d.flightEnd
                  : <span title="No flight dates — revenue allocated to the close-date quarter">— <span className="faint">(close)</span></span>}</td>
                <td className="r mono">{D$(A(d, 'Q1'))}</td>
                <td className="r mono">{D$(A(d, 'Q2'))}</td>
                <td className="r mono">{D$(A(d, 'Q3'))}</td>
                <td className="r mono">{D$(A(d, 'Q4'))}</td>
                <td style={{ minWidth: 256 }}><RecognitionTimeline closeDate={d.closeDate} flightStart={d.flightStart} flightEnd={d.flightEnd} value={d.weighted} /></td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="fc-total">
              <td style={{ fontWeight: 700 }}>Total · {rows.length} deals</td>
              <td className="r mono" style={{ fontWeight: 700 }}>{fmt.moneyFull(tot.amt)}</td>
              <td></td><td></td><td></td><td></td>
              <td className="r mono" style={{ fontWeight: 700 }}>{D$(Math.round(tot.Q1))}</td>
              <td className="r mono" style={{ fontWeight: 700 }}>{D$(Math.round(tot.Q2))}</td>
              <td className="r mono" style={{ fontWeight: 700 }}>{D$(Math.round(tot.Q3))}</td>
              <td className="r mono" style={{ fontWeight: 700 }}>{D$(Math.round(tot.Q4))}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style={{ marginTop: 12, display: 'flex', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap', alignItems: 'center' }}>
        <SourceNote>Q1–Q4 = weighted forecast split by inclusive flight-day overlap (Σ reconciles to each deal's weighted value). Deals with no flight dates are allocated to their close-date quarter — the CRM has no per-quarter split field.</SourceNote>
        <span className="faint" style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 16 }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 5, height: 5, borderRadius: 99, background: 'var(--c-commit)', display: 'inline-block' }}></span><span style={{ width: 20, height: 7, borderRadius: 4, background: 'linear-gradient(90deg, color-mix(in srgb, var(--c-commit) 30%, transparent), var(--c-commit))', display: 'inline-block' }}></span><span style={{ width: 5, height: 5, borderRadius: 99, background: 'var(--c-commit)', display: 'inline-block' }}></span>flight start → end (revenue recognized)</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 8, height: 8, borderRadius: 99, background: 'var(--text)', display: 'inline-block' }}></span>close / expected-close date</span>
          <span>· dashed = no flight dates (close-quarter fallback)</span>
        </span>
      </div>
    </Panel>
  );
}

  <script type="text/babel">
const { useState: useStateA, useEffect: useEffectA } = React;

const ACCENT_OPTIONS = ['#e5a00d', '#4f93f7', '#8b5cf6', '#25c266'];
const ACCENT_INK = { '#e5a00d': '#1a1304', '#4f93f7': '#05101f', '#8b5cf6': '#140a2b', '#25c266': '#04200f' };

const DIRECTIONS = {
  'Command center': { theme: 'dark',  density: 'compact',     chartStyle: 'columns', accent: '#e5a00d', glow: false },
  'Analyst':        { theme: 'dark',  density: 'comfortable', chartStyle: 'area',    accent: '#4f93f7', glow: false },
  'Boardroom':      { theme: 'dark',  density: 'comfortable', chartStyle: 'stems',   accent: '#e5a00d', glow: true  },
};

const TWEAK_DEFAULTS = {
  direction: 'Command center',
  theme: 'dark',
  density: 'compact',
  chartStyle: 'columns',
  accent: '#e5a00d',
  glow: false,
  commitDef: 'open ≥80% only',   // 'open ≥80% only' | 'open + won'
};

// Shown instead of the pages until the first live fetch settles, so the user
// never sees the stale offline snapshot flash before real numbers arrive.
function BootScreen() {
  return (
    <div className="boot-screen">
      <PlexLogo style={{ width: 44, height: 44 }} />
      <div className="boot-spinner"></div>
      <div className="boot-title">Pulling live figures from the CRM</div>
      <div className="boot-sub">Deals, stages and owners — a few seconds.</div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage]           = useStateA('forecast');
  const [collapsed, setCollapsed] = useStateA(false);
  const [query, setQuery]         = useStateA('');
  const [lens, setLens]           = useStateA('Weighted');
  const [pipeline, setPipeline]   = useStateA('All pipelines');
  const [fy, setFy]               = useStateA('FY2026');
  const [quarter, setQuarter]     = useStateA('Full year');   // quarter focus
  const [stageScope, setStageScope] = useStateA('All stages'); // stage scope
  const [kind, setKind]           = useStateA('Both');        // business type
  const [fyScope, setFyScope]     = useStateA('2026 flights'); // FY scope: '2026 flights' | '+ 2025/27 carryover'
  const [loading, setLoading]     = useStateA(false);
  // First paint is gated on the live fetch: until it settles we show a loading
  // screen, never the stale offline snapshot (that only appears, labeled, if the
  // fetch actually fails).
  const [booted, setBooted]       = useStateA(!!window.PLEX_RAW);
  const [, bump]                  = useStateA(0);   // forces re-render after live fetch
  const [drill, setDrill]         = useStateA(null); // active drill-down payload
  const [useCaseOpen, setUseCaseOpen] = useStateA(false); // use-case map overlay

  useEffectA(() => { window.__openDrill = setDrill; return () => { window.__openDrill = null; }; }, []);

  // Pull live data from the proxy (/api/forecast). On success, replace the global
  // PLEX_DATA so every component re-reads fresh numbers. On failure (e.g. opened as
  // a local file with no proxy), the offline snapshot stays in place.
  const refresh = React.useCallback(async () => {
    setLoading(true);
    try {
      const res = await fetch('api/forecast', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (j && !j.error) { window.PLEX_RAW = j; bump(n => n + 1); }
    } catch (e) {
      // keep the snapshot; mark it clearly as not-live
      console.warn('Live forecast unavailable, showing snapshot:', e.message);
    } finally {
      setLoading(false);
      setBooted(true);
    }
  }, []);

  useEffectA(() => { refresh(); }, [refresh]);   // auto-load live data on first render

  useEffectA(() => {
    const r = document.documentElement;
    r.dataset.theme   = t.theme;
    r.dataset.density = t.density;
    r.dataset.glow    = t.glow ? 'on' : 'off';
    r.style.setProperty('--accent',     t.accent);
    r.style.setProperty('--accent-ink', ACCENT_INK[t.accent] || '#1a1304');
  }, [t.theme, t.density, t.glow, t.accent]);

  const applyDirection = (name) => setTweak({ direction: name, ...DIRECTIONS[name] });

  // Derive the rendered view from the raw pool + active filters. Every page reads
  // window.PLEX_DATA, so this one line makes the filters apply everywhere at once.
  const rawData = window.PLEX_RAW || window.PLEX_DATA;
  window.PLEX_DATA = buildView(rawData, {
    quarter, stageScope, kind,
    carry: fyScope === '+ 2025/27 carryover',
    includeWon: t.commitDef === 'open + won',
  });

  const pageProps = { lens, setLens, pipeline, setPipeline, fy, setFy, chartStyle: t.chartStyle };
  let view;
  if      (!booted)             view = <BootScreen />;
  else if (page === 'forecast') view = <ForecastPage {...pageProps} />;
  else if (page === 'overview') view = <OverviewPage {...pageProps} />;
  else if (page === 'pipeline') view = <PipelinePage {...pageProps} />;
  else if (page === 'deals')    view = <DealsPage {...pageProps} />;
  else if (page === 'accounts') view = <AccountsPage {...pageProps} />;
  else                          view = <ComingPage id={page} {...pageProps} />;

  return (
    <FilterCtx.Provider value={{ quarter, setQuarter, stageScope, setStageScope, kind, setKind, fyScope, setFyScope }}>
    <div className={`shell ${collapsed ? 'nav-collapsed' : ''}`}>
      <Sidebar page={page} setPage={setPage} collapsed={collapsed} />
      <div className="main">
        <Topbar onCollapse={() => setCollapsed(c => !c)} query={query} setQuery={setQuery}
          onRefresh={refresh} loading={loading} live={!!window.PLEX_DATA.live} updated={window.PLEX_DATA.updated}
          onUseCase={() => setUseCaseOpen(true)} booting={!booted} />
        {view}
      </div>

      <DrillModal drill={drill} onClose={() => setDrill(null)} />
      <UseCaseModal open={useCaseOpen} onClose={() => setUseCaseOpen(false)} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Direction" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6, marginBottom: 6 }}>
          {Object.keys(DIRECTIONS).map(name => (
            <button key={name} onClick={() => applyDirection(name)}
              style={{
                padding: '9px 6px', borderRadius: 9, fontSize: 11.5, fontWeight: 600, lineHeight: 1.15,
                border: '1px solid ' + (t.direction === name ? 'var(--accent)' : 'var(--border-2)'),
                background: t.direction === name ? 'color-mix(in srgb, var(--accent) 16%, transparent)' : 'transparent',
                color: t.direction === name ? 'var(--text)' : 'var(--text-2)', cursor: 'pointer',
              }}>{name}</button>
          ))}
        </div>

        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme} options={['dark', 'light']} onChange={v => setTweak('theme', v)} />
        <TweakColor label="Accent" value={t.accent} options={ACCENT_OPTIONS} onChange={v => setTweak('accent', v)} />
        <TweakToggle label="Cinematic glow" value={t.glow} onChange={v => setTweak('glow', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density} options={['compact', 'comfortable']} onChange={v => setTweak('density', v)} />

        <TweakSection label="Forecast chart" />
        <TweakRadio label="Style" value={t.chartStyle} options={['columns', 'area', 'stems']} onChange={v => setTweak('chartStyle', v)} />

        <TweakSection label="Metrics" />
        <TweakRadio label="Commit" value={t.commitDef} options={['open ≥80% only', 'open + won']} onChange={v => setTweak('commitDef', v)} />
      </TweaksPanel>
    </div>
    </FilterCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
