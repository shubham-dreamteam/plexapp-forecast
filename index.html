<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact" data-glow="off">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlexApp · Revenue Forecast</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   PlexApp — Revenue Forecast cockpit
   Design tokens + theming + component styles
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk', system-ui, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, monospace;

  --c-commit: #25c266;
  --c-commit-soft: rgba(37, 194, 102, 0.16);
  --c-best:   #f0a92a;
  --c-best-soft: rgba(240, 169, 42, 0.16);
  --c-pipe:   #4f93f7;
  --c-pipe-soft: rgba(79, 147, 247, 0.16);
  --c-risk:   #f25555;
  --c-risk-soft: rgba(242, 85, 85, 0.15);
  --c-won:    #8b3fd4;
  --c-won-soft: rgba(139, 63, 212, 0.16);

  --accent: #e5a00d;
  --accent-ink: #1a1304;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 26px;
  --ease: cubic-bezier(.2,.7,.2,1);

  --pad-card: 24px;
  --gap: 20px;
  --kpi-num: 56px;
  --row-h: 44px;
}

:root[data-density="compact"] {
  --pad-card: 16px;
  --gap: 14px;
  --kpi-num: 44px;
  --row-h: 36px;
}

/* ---------- DARK (default) ---------- */
:root[data-theme="dark"] {
  --bg: #0c0c0e;
  --bg-grad: radial-gradient(1200px 700px at 78% -10%, rgba(229,160,13,0.10), transparent 60%),
             radial-gradient(900px 600px at -5% 0%, rgba(79,147,247,0.06), transparent 55%);
  --surface: #fff0;
  --card: #151517;
  --card-2: #1c1c1f;
  --card-3: #232327;
  --inset: #101012;
  --border: rgba(255,255,255,0.075);
  --border-2: rgba(255,255,255,0.13);
  --text: #f5f5f6;
  --text-2: #a4a4ad;
  --text-3: #6a6a73;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 40px -24px rgba(0,0,0,0.8);
  --grid-line: rgba(255,255,255,0.06);
  --logo-ink: #ffffff;
  --track: rgba(255,255,255,0.07);
}

/* ---------- LIGHT ---------- */
:root[data-theme="light"] {
  --bg: #f4f3ef;
  --bg-grad: radial-gradient(1100px 650px at 80% -12%, rgba(229,160,13,0.10), transparent 60%),
             radial-gradient(800px 500px at -5% 0%, rgba(79,147,247,0.05), transparent 55%);
  --surface: #fff0;
  --card: #ffffff;
  --card-2: #f7f6f3;
  --card-3: #eeede9;
  --inset: #f1f0ec;
  --border: rgba(20,18,12,0.08);
  --border-2: rgba(20,18,12,0.14);
  --text: #1a1a1d;
  --text-2: #5d5d66;
  --text-3: #9a9aa2;
  --shadow: 0 1px 2px rgba(20,18,12,0.04), 0 22px 44px -30px rgba(20,18,12,0.28);
  --grid-line: rgba(20,18,12,0.07);
  --logo-ink: #1c1c1f;
  --track: rgba(20,18,12,0.07);
}

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent); color: var(--accent-ink); }

.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); }

/* ============================================================
   APP SHELL
   ============================================================ */
#app { min-height: 100vh; }
.shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
}
:root[data-density="compact"] .shell { grid-template-columns: 224px 1fr; }
.shell.nav-collapsed { grid-template-columns: 72px 1fr; }

/* ---------- SIDEBAR ---------- */
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh;
  display: flex; flex-direction: column;
  padding: 20px 14px;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
.brand .logo { height: 22px; width: auto; color: var(--logo-ink); flex: none; }
.brand .div { width: 1px; height: 18px; background: var(--border-2); }
.brand .unit { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; white-space: nowrap; }
.nav-collapsed .brand .div, .nav-collapsed .brand .unit { display: none; }

.workspace {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; margin-bottom: 16px;
  background: var(--card-2); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; transition: border-color .2s;
}
.workspace:hover { border-color: var(--border-2); }
.workspace .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-commit); box-shadow: 0 0 10px var(--c-commit); flex: none; }
.workspace .ws-txt { flex: 1; min-width: 0; }
.workspace .ws-label { font-size: 10px; letter-spacing: .14em; color: var(--text-3); font-weight: 700; }
.workspace .ws-name { font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workspace .chev { color: var(--text-3); flex: none; }
.nav-collapsed .workspace { justify-content: center; }
.nav-collapsed .workspace .ws-txt, .nav-collapsed .workspace .chev { display: none; }

.nav-group-label { font-size: 10px; letter-spacing: .16em; font-weight: 700; color: var(--text-3); padding: 16px 12px 8px; }
.nav-collapsed .nav-group-label { text-align: center; font-size: 0; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--text-2); font-size: 14px; font-weight: 500;
  background: none; border: none; text-align: left; width: 100%;
  position: relative; transition: background-color .15s, color .15s;
}
.nav-item:hover { background: var(--card-2); color: var(--text); }
.nav-item.active { background: var(--card-3); color: var(--text); font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.nav-item .ico { flex: none; width: 18px; height: 18px; }
.nav-item .badge {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px;
  background: var(--card-3); color: var(--text-2);
}
.nav-item.active .badge { background: var(--accent); color: var(--accent-ink); }
.nav-collapsed .nav-item { justify-content: center; }
.nav-collapsed .nav-item .label, .nav-collapsed .nav-item .badge { display: none; }
.sidebar-foot { margin-top: auto; padding-top: 12px; }

/* ---------- MAIN ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 16px 30px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}
.collapse-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text-2); flex: none; }
.collapse-btn:hover { color: var(--text); border-color: var(--border-2); }
.search {
  flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--r-md);
  background: var(--card); border: 1px solid var(--border); color: var(--text-3);
  transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: inherit; }
.search input::placeholder { color: var(--text-3); }
.search kbd { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); border: 1px solid var(--border-2); border-radius: 5px; padding: 1px 6px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 10px 15px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--border-2); background-color: var(--card); color: var(--text);
  transition: transform .12s var(--ease), border-color .15s;
}
.btn:hover { border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 24px -10px var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn .ico { width: 16px; height: 16px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #c9731c));
  color: var(--accent-ink); border: 1px solid var(--border-2);
}

/* ---------- PAGE ---------- */
.page { padding: 26px 30px 60px; max-width: 1640px; width: 100%; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head > div:first-child { flex: 1 1 auto; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--text-3); margin-bottom: 12px; white-space: nowrap; flex-wrap: nowrap; }
.eyebrow .hot { color: var(--accent); }
.eyebrow .sep { color: var(--text-3); opacity: .5; }
h1.title { font-family: var(--font-display); font-weight: 700; font-size: 42px; letter-spacing: -0.025em; margin: 0; line-height: 1; }
:root[data-density="compact"] h1.title { font-size: 34px; }
.head-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* segmented control */
.segmented { display: inline-flex; padding: 4px; gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; }
.segmented button { border: none; background: none; color: var(--text-2); font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; transition: color .15s; position: relative; }
.segmented button.on { color: var(--accent-ink); background: var(--accent); box-shadow: 0 4px 14px -6px var(--accent); }
.segmented button:not(.on):hover { color: var(--text); }

/* dropdown pill */
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 999px; position: relative; }
.pill:hover { border-color: var(--border-2); }
.pill .chev { color: var(--text-3); }
.menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px; background: var(--card); border: 1px solid var(--border-2); border-radius: var(--r-md); box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); padding: 6px; z-index: 50; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 11px; border-radius: var(--r-sm); border: none; background: none; color: var(--text-2); font-size: 13px; font-weight: 500; }
.menu button:hover { background: var(--card-2); color: var(--text); }
.menu button.sel { color: var(--text); }
.menu button .ck { margin-left: auto; color: var(--accent); }

/* ============================================================
   CARDS / PANELS
   ============================================================ */
.grid { display: grid; gap: var(--gap); }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.panel { padding: var(--pad-card); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.panel-title { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; margin: 0; }
.panel-sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
.kpi {
  padding: var(--pad-card); cursor: default;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  position: relative; overflow: hidden; transition: border-color .2s, transform .2s var(--ease);
}
.kpi::after { content:''; position: absolute; left:0; top:0; height: 3px; width: 100%; background: linear-gradient(90deg, var(--kpi-accent, var(--accent)), transparent 70%); opacity: .8; }
.kpi:hover { border-color: var(--border-2); transform: translateY(-2px); }
.kpi .k-label { font-size: 11px; letter-spacing: .12em; font-weight: 700; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.kpi .k-val { font-size: var(--kpi-num); font-weight: 700; line-height: 1.04; margin: 12px 0 6px; letter-spacing: -.03em; }
.kpi .k-sub { font-size: 12.5px; color: var(--text-3); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-display); font-size: 14px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.delta.up { color: var(--c-commit); background: var(--c-commit-soft); }
.delta.down { color: var(--c-risk); background: var(--c-risk-soft); }
.k-val .delta { vertical-align: middle; margin-left: 8px; font-size: 16px; }

/* attainment mini-bar inside kpi */
.att-track { height: 7px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 14px 0 8px; }
.att-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb,var(--accent) 55%, #c9731c)); position: relative; }
.att-fill .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .8; }

/* ============================================================
   CHARTS
   ============================================================ */
.chart-wrap { position: relative; width: 100%; }
.bar-chart { position: relative; }
.axis-label { font-size: 11px; fill: var(--text-3); font-family: var(--font-mono); }
.grid-line { stroke: var(--grid-line); stroke-width: 1; }
.target-line { stroke: var(--text-2); stroke-width: 1.5; stroke-dasharray: 6 5; }
.col-seg { transition: opacity .15s; cursor: pointer; }
.col-seg:hover { opacity: .85; }
.bar-total { font-family: var(--font-display); font-weight: 700; fill: var(--text); }
.q-label { font-family: var(--font-ui); font-weight: 600; fill: var(--text-2); font-size: 13px; }
.q-label.now { fill: var(--accent); }

.legend { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.legend .lg { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; }
.legend .sw.dash { width: 16px; height: 0; border-top: 2px dashed var(--text-2); border-radius: 0; }

/* tooltip */
.tip {
  position: fixed; z-index: 200; pointer-events: none;
  background: var(--card-3); border: 1px solid var(--border-2);
  border-radius: var(--r-md); padding: 12px 14px; min-width: 168px;
  box-shadow: 0 20px 50px -16px rgba(0,0,0,.6); transform: translate(-50%, -112%);
  transition: opacity .12s;
}
.tip h5 { margin: 0 0 8px; font-size: 13px; font-family: var(--font-display); font-weight: 600; }
.tip .tr { display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: 12.5px; padding: 2px 0; color: var(--text-2); }
.tip .tr .lhs { display: flex; align-items: center; gap: 7px; }
.tip .tr .sw { width: 9px; height: 9px; border-radius: 2px; }
.tip .tr b { color: var(--text); font-family: var(--font-display); }
.tip .trtot { border-top: 1px solid var(--border); margin-top: 7px; padding-top: 7px; font-weight: 600; }

/* horizontal stage/partner bars */
.hbar-list { display: flex; flex-direction: column; gap: 16px; }
.hbar { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; }
.hbar .hb-name { font-size: 14px; font-weight: 600; color: var(--text); }
.hbar .hb-val { font-family: var(--font-display); font-weight: 700; font-size: 15px; text-align: right; }
.hbar .hb-sub { font-size: 11.5px; color: var(--text-3); text-align: right; grid-column: 2; }
.hbar .hb-track { grid-column: 1 / 2; grid-row: 2; height: 26px; border-radius: 7px; background: var(--track); overflow: hidden; position: relative; display: flex; align-items: center; }
.hbar .hb-fill { height: 100%; border-radius: 7px; display: flex; align-items: center; padding: 0 10px; min-width: 26px; transition: width .6s var(--ease); }
.hbar .hb-count { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #fff; }
.hbar .hb-ghost { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }

/* partner concentration */
.conc { display: flex; flex-direction: column; gap: 13px; }
.conc-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; }
.conc-rank { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }
.conc-name { font-size: 13.5px; font-weight: 600; }
.conc-sub { font-size: 11px; color: var(--text-3); }
.conc-track { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 6px; }
.conc-fill { height: 100%; border-radius: 99px; background: var(--accent); }
.conc-val { font-family: var(--font-display); font-weight: 700; font-size: 14px; text-align: right; }

/* ============================================================
   INSIGHT CARDS
   ============================================================ */
.insight {
  display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--r-md);
  background: var(--card-2); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.insight.flag { border-color: color-mix(in srgb, var(--c-best) 35%, var(--border)); }
.insight.good { border-color: color-mix(in srgb, var(--c-commit) 30%, var(--border)); }
.insight .ins-ico { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--card-3); }
.insight h4 { margin: 0 0 4px; font-size: 14px; font-family: var(--font-display); font-weight: 600; }
.insight p { margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.5; }
.insight .calc { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); margin-top: 9px; line-height: 1.5; }
.insight b.hl { color: var(--text); }

/* coverage gauge */
.gauge-wrap { display: flex; align-items: center; gap: 22px; }
.gauge-readout { display: flex; flex-direction: column; }
.gauge-readout .gr-big { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -.03em; }
.gauge-readout .gr-lab { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* ---------- empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 70px 30px; gap: 8px;
  border: 1.5px dashed var(--border-2); border-radius: var(--r-lg); background: var(--card-2);
}
.empty .e-ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--card-3); color: var(--text-3); margin-bottom: 10px; }
.empty h3 { margin: 0; font-family: var(--font-display); font-size: 20px; display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.empty p { margin: 0; max-width: 420px; color: var(--text-2); font-size: 14px; line-height: 1.55; }
.empty .pillrow { margin-top: 16px; display: flex; gap: 10px; }
.tag-soon { white-space: nowrap; flex: none; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--accent); border: 1px solid color-mix(in srgb,var(--accent) 40%, transparent); padding: 2px 8px; border-radius: 99px; }

/* ---------- data-source note ---------- */
.source-note { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--text-3); padding: 6px 11px; border: 1px solid var(--border); border-radius: 99px; background: var(--card-2); }
.source-note .d { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* table */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; color: var(--text); }
.tbl tr:hover td { background: var(--card-2); }
.tbl .r { text-align: right; font-family: var(--font-display); font-weight: 600; }
.tbl tfoot .fc-total td { border-top: 2px solid var(--border-2); border-bottom: none; background: var(--card-2); }
.stage-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
.stage-chip .dot { width: 7px; height: 7px; border-radius: 50%; }

/* data tables: toolbar, sorting, scroll */
.dt-wrap { overflow-x: auto; }
.dt-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.dt-search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; max-width: 360px;

.dt-search input { background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; width: 100%; font-family: var(--font-ui); }
.seg-mini { display: inline-flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
.seg-mini button { border: none; background: none; color: var(--text-2); font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-family: var(--font-ui); }
.seg-mini button.on { background: var(--accent); color: var(--accent-ink); }
.goal-input { width: 100%; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; color: var(--text); font-size: 13px; font-family: var(--font-mono); outline: none; transition: border-color .15s; }
.goal-input:focus { border-color: var(--accent); }
.goal-input::placeholder { color: var(--text-3); }
.tbl th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
.tbl th.sort:hover { color: var(--text); }
.tbl th .caret { opacity: .55; font-size: 9px; margin-left: 3px; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.acct { font-weight: 600; }
.dt-count { font-size: 12.5px; color: var(--text-3); margin-left: auto; font-family: var(--font-mono); }

.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; }
.tag.open { background: color-mix(in srgb, var(--c-pipe) 18%, transparent); color: var(--c-pipe); }
.tag.lost { background: color-mix(in srgb, var(--c-risk) 16%, transparent); color: var(--c-risk); }
.tag.won  { background: color-mix(in srgb, var(--c-commit) 16%, transparent); color: var(--c-commit); }

.pbar { width: 54px; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; display: inline-block; vertical-align: middle; }
.pbar > span { display: block; height: 100%; border-radius: 99px; }

.acct-ico { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 4px; }
.kcol { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-height: 120px; }
.kcol-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.kcol-head .t { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; }
.kcol-head .v { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-2); }
.kcard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 9px; transition: border-color .15s, transform .15s; cursor: default; }
.kcard:hover { border-color: var(--border-2); transform: translateY(-1px); }
.kcard .nm { font-weight: 600; font-size: 13px; margin-bottom: 6px; line-height: 1.25; }
.kcard .meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-3); }
.kcard .amt { font-family: var(--font-display); font-weight: 700; color: var(--text); }
.kcard.clickable { cursor: pointer; }

/* drillable affordances */
/* clickable KPI: keep the accent top-bar (.kpi::after) intact; just refine hover */
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border-2)); box-shadow: 0 10px 30px rgba(0,0,0,.30); }
.clickrow { cursor: pointer; }
.hb-track.clickable, .conc-row.clickable, .gauge-wrap.clickable { cursor: pointer; }
.tbl tr.clickrow:hover td { background: var(--card-2); }

/* drill modal */
.modal-overlay { position: fixed; inset: 0; z-index: 1000; background: color-mix(in srgb, #000 62%, transparent);
  backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 24px 24px; animation: fadeIn .15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { width: 100%; max-width: 1240px; max-height: 92vh; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--border-2); border-radius: var(--r-lg);
  box-shadow: 0 30px 80px rgba(0,0,0,.55); animation: fadeUp .22s var(--ease) both; overflow: hidden; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
.modal-eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
.modal-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.modal-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.modal-x { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-2); color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
.modal-x:hover { color: var(--text); border-color: var(--border-2); }
.modal-stats { display: flex; flex-wrap: wrap; gap: 26px; padding: 16px 22px; border-bottom: 1px solid var(--border); }
.mstat .ms-lab { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 700; margin-bottom: 3px; }
.mstat .ms-val { font-size: 22px; font-weight: 700; }
.modal-note { padding: 12px 22px; font-size: 12.5px; color: var(--text-2); background: var(--card-2); border-bottom: 1px solid var(--border); }
.modal-body { overflow-y: auto; padding: 4px 8px 8px; }
/* drill column picker — add optional columns to the deal table */
.colpick { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 22px; border-bottom: 1px solid var(--border); }
.colpick .cp-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-right: 4px; }
.colpick button { font-size: 11.5px; font-weight: 600; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--border); background: var(--card-2); color: var(--text-2); cursor: pointer; transition: all .12s var(--ease); }
.colpick button:hover { border-color: var(--border-2); color: var(--text); }
.colpick button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }

/* use-case overlay (embeds the cream use-case map page) */
.uc-overlay { position: fixed; inset: 0; z-index: 1100; background: color-mix(in srgb, #000 66%, transparent);
  backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 4vh 3vw; animation: fadeIn .15s ease; }
.uc-modal { width: 100%; max-width: 1180px; height: 92vh; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border-2); box-shadow: 0 30px 90px rgba(0,0,0,.6); animation: fadeUp .22s var(--ease) both; background: #ede7d9; }
.uc-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--ink, #0c0c0e); border-bottom: 1px solid rgba(255,255,255,.08); }
.uc-bar .uc-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #fff; }
.uc-frame { flex: 1; width: 100%; border: 0; background: #ede7d9; }

/* per-deal revenue-recognition strip */
.qstrip { display: block; }
.qstrip .ql { font-size: 8px; fill: var(--text-3); font-family: var(--font-mono); }
.info-pill { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border: 1px solid var(--border-2);
  background: var(--card-2); color: var(--text-2); border-radius: 99px; padding: 5px 12px 5px 10px; font-size: 12.5px; font-weight: 600;
  transition: border-color .15s, color .15s; }
.info-pill:hover { border-color: var(--accent); color: var(--text); }
.info-pill .i-ico { color: var(--accent); }

/* misc layout helpers */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.fade-up { animation: fadeUp .5s var(--ease) both; }
@keyframes fadeUp { from { transform: translateY(10px); } to { transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
.ico.spin { animation: spin .8s linear infinite; transform-origin: 50% 50%; }

/* first-load gate — shown while the live CRM fetch is in flight */
.boot-screen { flex: 1; min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; animation: fadeIn .2s ease; }
.boot-spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--border-2); border-top-color: var(--accent); animation: spin .7s linear infinite; }
.boot-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text); }
.boot-sub { font-size: 12.5px; color: var(--text-3); }
.btn[disabled] { opacity: .6; cursor: default; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-commit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-commit) 22%, transparent); display: inline-block; }
.live-dot.snapshot { background: var(--text-3); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-3) 18%, transparent); }
@media (prefers-reduced-motion: reduce) { .fade-up { animation: none; } * { scroll-behavior: auto; } }

/* glow direction flourish */
:root[data-glow="on"] .kpi .k-val { text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 30%, transparent); }
:root[data-glow="on"] .card { box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb,var(--accent) 6%, transparent); }

/* responsive */
@media (max-width: 1200px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .col-2 { grid-template-columns: 1fr !important; }
}

  <!-- ── data.js — live from plexapp.dreamteamcrm.ai via GET API (Jun 6 2026) ── -->
  <script>
(function () {
  const K = 1000, M = 1000000;

  // ── All figures fetched live from the PlexApp DreamTeam CRM.
  // ── No data invented. No quota/target in the CRM → attainment shown as empty state.
  // ── 36 total deals: 28 open, 8 closed-lost.

  const kpis = {
    weighted: { value: 506 * K,  label: 'Weighted forecast', sub: 'of $1.35M total pipeline',   accent: 'var(--accent)' },
    commit:   { value: 240 * K,  label: 'Commit (≥80%)',     sub: '5 deals · full amount at ≥ 80% probability', accent: 'var(--c-commit)' },
    openPipe: { value: 1350100,  label: 'Open pipeline',     sub: '28 open deals',               accent: 'var(--c-pipe)' },
  };

  const unweightedTotal = 1350100;
  const weightedTotal   = 506000;
  const commitAmount    = 240000;   // full amount of deals at ≥80% prob
  const commitWeighted  = 234000;   // prob-adjusted commit
  const commitRate      = 46;       // commitWeighted / weightedTotal × 100, rounded
  const totalDeals      = 28;

  // Quarterly — all weighted (commit/best/pipe split by probability tier)
  const quarters = [
    { q: 'Q1', total: 0,       commit: 0,       best: 0,       pipe: 0,      won: 0 },
    { q: 'Q2', total: 145000,  commit: 105000,  best: 0,       pipe: 40000,  won: 0, now: true },
    { q: 'Q3', total: 271000,  commit: 129000,  best: 25000,   pipe: 117000, won: 0 },
    { q: 'Q4', total: 90000,   commit: 0,       best: 0,       pipe: 90000,  won: 0 },
  ];

  // Stages (open deals only — no Closed Won stage deals in CRM)
  const stages = [
    { name: 'Pitch',    count: 8,  weighted: 135000, total: 255000,   color: 'var(--c-pipe)' },
    { name: 'Proposal', count: 20, weighted: 371000, total: 1095100,  color: 'var(--c-best)' },
  ];

  // Partners — real names from CRM, normalised; top 5 by weighted + residual
  const partnersKnown = [
    { name: 'Playwire',           deals: 12, weighted: 241000 },
    { name: 'AMC - Direct',       deals: 5,  weighted: 165000 },
    { name: 'Crunchyroll',        deals: 1,  weighted: 45000  },
    { name: 'Carry1',             deals: 1,  weighted: 30000  },
    { name: 'Ribbow Media',       deals: 2,  weighted: 25000  },
  ];
  const knownWeighted = partnersKnown.reduce((s, p) => s + p.weighted, 0); // 506K
  const knownDeals    = partnersKnown.reduce((s, p) => s + p.deals, 0);    // 21
  // Remaining 7 open deals (Sony TV, PBS, Kargo, IGM Partners, SuperAwesome, Diversity Media, unassigned)
  // all have $0 weighted value — shown as "Other" residual
  const residual = {
    name: 'Other partners', deals: totalDeals - knownDeals,
    weighted: Math.max(0, weightedTotal - knownWeighted),
    derived: true,
  };
  const partners = [...partnersKnown, residual];

  const top3Share  = Math.round((241000 + 165000 + 45000) / weightedTotal * 100); // 89%
  const bestUpside = quarters.reduce((s, q) => s + q.best, 0);
  const pipeUpside = quarters.reduce((s, q) => s + q.pipe, 0);
  const weightedPct = Math.round(weightedTotal / unweightedTotal * 100); // 37%

  const insights = [
    {
      tone: 'flag', icon: 'layers',
      title: 'Playwire drives 48% of weighted revenue',
      body: `Playwire accounts for <b class="hl">$241K</b> of the $506K weighted forecast — high single-partner concentration that creates risk if the relationship slips.`,
      calc: `$241K ÷ $506K  =  48%   ·   top-3 share (Playwire + AMC + Crunchyroll) = ${top3Share}%`,
    },
    {
      tone: 'plain', icon: 'spark',
      title: 'Q3 carries 54% of the weighted pipeline',
      body: `<b class="hl">$271K</b> of the $506K weighted forecast closes in Q3 (Jul–Sep). Q2 is live now at <b class="hl">$145K</b>, with $105K in commit.`,
      calc: `$271K ÷ $506K  =  54%   ·   Q2 commit = $105K   ·   Q4 = $90K (all pipeline, no commit)`,
    },
    {
      tone: 'good', icon: 'target',
      title: '$240K in commit-level deals',
      body: `5 deals at ≥ 80% probability carry <b class="hl">$240K</b> — <b class="hl">46%</b> of the weighted forecast is in high-confidence pipeline. Best-case adds another <b class="hl">$${Math.round(bestUpside/K)}K</b>.`,
      calc: `$234K weighted commit ÷ $506K  =  46%   ·   best-case upside = $${Math.round(bestUpside/K)}K   ·   pipeline = $${Math.round(pipeUpside/K)}K`,
    },
    {
      tone: 'flag', icon: 'alert',
      title: '10 open deals have no dollar value',
      body: `10 of 28 open deals have no amount entered — they are invisible to the weighted forecast and do not appear in any quarterly bucket until priced.`,
      calc: `10 ÷ 28 open deals = 36% without a value   ·   weighted probability blended = ${weightedPct}%`,
    },
  ];

  const missing = {
    history: 'No historical quota or attainment data is in the CRM. Connect a quota system (Salesforce quota object, Google Sheets, etc.) to unlock attainment %, coverage ratio, and velocity trends.',
    deals: 'Individual deal line-items are available via the CRM API — this table view requires a live CRM connection to render the full register.',
    quota: 'No FY2026 quota is configured in the CRM. Attainment and pipeline coverage vs target cannot be computed without it.',
  };

  // Offline snapshot — shown instantly on load and as a fallback if the live
  // /api/forecast call is unavailable (e.g. opened as a local file). When hosted
  // on Cloudflare the page fetches live data on load and overwrites this.
  window.PLEX_DATA = {
    fy: 'FY2026', updated: 'Jun 6, 2026 (snapshot)', unit: 'Ad Sales', live: false,
    kpis, quarters, stages, partners, insights, missing,
    channelsOpen: [], channelsBooked: [], channelOrder: [],
    totals: {
      unweighted: unweightedTotal, weightedRaw: weightedTotal, totalDeals,
      commitAmount, commitWeighted, commitRate,
      commitCount: 0, commitOpenCount: 0, wonCount: 0, wonAmount: 0, wonWeighted: 0,
      totalForecast: weightedTotal, weightedPlusBooked: weightedTotal,
      top3Share, bestUpside, pipeUpside, weightedPct,
      knownWeighted,
      target: null, // no quota in CRM
    },
    pipelines: ['All pipelines', 'Default Pipeline'],
    fyOptions: ['FY2026'],
  };

  window.fmt = {
    money(n) {
      const a = Math.abs(n);
      if (a >= M) {
        // Use 2 dp for values < 2M for precision ($1.35M not $1.4M)
        const dp = a < 2 * M ? 2 : (n % M === 0 ? 0 : 1);
        return '$' + (n / M).toFixed(dp).replace(/\.?0+$/, '') + 'M';
      }
      if (a >= K) return '$' + Math.round(n / K) + 'K';
      return '$' + n;
    },
    moneyFull(n) { return '$' + Math.round(n).toLocaleString('en-US'); },
    pct(n) { return (n > 0 ? '+' : '') + n + '%'; },
  };
})();
  </script>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight  = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight,  Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right  = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight  = window.innerWidth  - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight  - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label  : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options} onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakToggle, TweakRadio, TweakSelect, TweakColor,
});
  </script>

  <!-- ── charts.jsx ── -->
  <script type="text/babel">
const { useState, useRef, useCallback } = React;

const SERIES = [
  { key: 'pipe',   label: 'Pipeline',  color: 'var(--c-pipe)',   fill: 'var(--c-pipe-soft)' },
  { key: 'best',   label: 'Best case', color: 'var(--c-best)',   fill: 'var(--c-best-soft)' },
  { key: 'commit', label: 'Commit',    color: 'var(--c-commit)', fill: 'var(--c-commit-soft)' },
  { key: 'won',    label: 'Booked',    color: 'var(--c-won)',    fill: 'var(--c-won-soft)' },
];

function useTooltip() {
  const [tip, setTip] = useState(null);
  const show = (e, content) => setTip({ x: e.clientX, y: e.clientY, content });
  const move = (e) => setTip(t => t ? { ...t, x: e.clientX, y: e.clientY } : t);
  const hide = () => setTip(null);
  const node = tip ? (
    <div className="tip" style={{ left: tip.x, top: tip.y, opacity: 1 }}>{tip.content}</div>
  ) : null;
  return { show, move, hide, node };
}

/* ============================================================
   Drill-down plumbing — every metric resolves to its underlying
   open deals, which the modal then lists. Globals so any chart
   or KPI (across script blocks) can call them at click time.
   ============================================================ */
window.__deals = () => (window.PLEX_DATA && Array.isArray(window.PLEX_DATA.deals) ? window.PLEX_DATA.deals : []);
window.openDrill = (payload) => { if (window.__openDrill) window.__openDrill(payload); };
const TIER_LABEL = { commit: 'Commit (≥80%)', best: 'Best-case (50–79%)', pipe: 'Pipeline (<50%)' };
window.drillData = {
  open:    () => window.__deals().filter(d => d.open),
  all:     () => window.__deals(),
  lost:    () => window.__deals().filter(d => !d.open),
  // a deal contributes to a quarter if it has value allocated there (open = weighted,
  // won = booked); show that allocated slice so the drill total matches the bar.
  quarter: (q) => window.__deals().filter(d => d.alloc && d.alloc[q] > 0).map(d => ({ ...d, weighted: d.alloc[q] })),
  stage:   (name) => window.__deals().filter(d => d.open && d.stage === name),
  tier:    (t) => window.__deals().filter(d => d.open && d.tier === t),
  quarterTier: (q, t) => window.__deals().filter(d => d.open && d.quarter === q && d.tier === t),
  partner: (name) => {
    const top = ((window.PLEX_DATA && window.PLEX_DATA.partners) || []).filter(p => !p.derived).map(p => p.name);
    if (name === 'Other partners') return window.__deals().filter(d => d.open && !top.includes(d.partner));
    return window.__deals().filter(d => d.open && d.partner === name);
  },
  account: (id) => window.__deals().filter(d => d.accountId === id),
};
// short payload builders so KPI click sites stay tiny
window.kpiDrill = {
  weighted:  () => ({ eyebrow: 'Weighted forecast', title: 'Weighted forecast', subtitle: 'All open deals · amount × probability', deals: window.drillData.open() }),
  commit:    () => (window.PLEX_DATA && window.PLEX_DATA.includeWon
    ? { eyebrow: 'Commit', title: 'Commit (≥80% + closed-won)', subtitle: 'Open deals at 80%+ probability, plus already-won deals', deals: [...window.drillData.tier('commit'), ...window.__deals().filter(d => d.status === 'Won')] }
    : { eyebrow: 'Commit', title: 'Commit (open deals ≥ 80%)', subtitle: 'Open deals at 80%+ probability — booked revenue counted separately', deals: window.drillData.tier('commit') }),
  pipeline:  () => ({ eyebrow: 'Open pipeline', title: 'Open pipeline', subtitle: 'All open deals · unweighted amount', deals: window.drillData.open() }),
  openDeals: () => ({ eyebrow: 'Open deals', title: 'Open deals', subtitle: 'Every open deal in the CRM', deals: window.drillData.open() }),
  lost:      () => ({ eyebrow: 'Closed lost', title: 'Closed-lost deals', subtitle: 'Excluded from the forecast', deals: window.drillData.lost() }),
  all:       () => ({ eyebrow: 'All deals', title: 'All deals', subtitle: 'Every deal in the CRM (open + closed)', deals: window.drillData.all() }),
};

function QuarterlyChart({ quarters, style = 'columns', tip }) {
  const W = 760, H = 520;
  const padL = 58, padR = 18, padT = 34, padB = 38;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const plotW = x1 - x0, plotH = y1 - y0;
  const grand = (q) => (q.commit || 0) + (q.best || 0) + (q.pipe || 0) + (q.won || 0);
  const niceCeil = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; };
  const maxY = niceCeil(Math.max(1, ...quarters.map(grand), ...quarters.map(q => q.target || 0)));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(maxY * f));
  const yS = (v) => y1 - (v / maxY) * plotH;
  const axisLabel = (t) => t === 0 ? '$0' : (t >= 1e6 ? '$' + (t / 1e6).toFixed(t % 1e6 ? 1 : 0) + 'M' : '$' + Math.round(t / 1000) + 'K');
  const n = quarters.length;
  const band = plotW / n;
  const colW = Math.min(78, band * 0.46);
  const cx = (i) => x0 + band * i + band / 2;

  const tipContent = (q) => (
    <div>
      <h5>{q.now ? q.q + ' · current' : q.q} <span className="faint mono" style={{fontWeight:400,fontSize:11}}>{fmt.money(grand(q))}</span></h5>
      {[...SERIES].reverse().map(s => q[s.key] > 0 && (
        <div className="tr" key={s.key}>
          <span className="lhs"><span className="sw" style={{ background: s.color }}></span>{s.label}</span>
          <b>{fmt.money(q[s.key])}</b>
        </div>
      ))}
      {q.target > 0 && <div className="tr trtot"><span className="lhs">Goal</span><b>{fmt.money(q.target)}</b></div>}
    </div>
  );

  const segHandlers = (q) => ({
    onMouseEnter: (e) => tip.show(e, tipContent(q)),
    onMouseMove: tip.move,
    onMouseLeave: tip.hide,
    style: { cursor: 'pointer' },
    onClick: () => {
      tip.hide();
      window.openDrill({
        eyebrow: 'Quarter', title: `${q.q} · ${fmt.money(q.total)} weighted`,
        subtitle: 'Weighted value allocated to this quarter by flight-date proration · "Weighted" = each deal\'s slice in ' + q.q,
        deals: window.drillData.quarter(q.q),
      });
    },
  });

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }} role="img" aria-label="Quarterly weighted forecast">
      <defs>
        <linearGradient id="gCommit" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-commit)"/><stop offset="1" stopColor="var(--c-commit)" stopOpacity="0.82"/></linearGradient>
        <linearGradient id="gBest"   x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-best)"/><stop offset="1" stopColor="var(--c-best)" stopOpacity="0.82"/></linearGradient>
        <linearGradient id="gPipe"   x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-pipe)"/><stop offset="1" stopColor="var(--c-pipe)" stopOpacity="0.82"/></linearGradient>
        <linearGradient id="gWon"    x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-won)"/><stop offset="1" stopColor="var(--c-won)" stopOpacity="0.82"/></linearGradient>
        <linearGradient id="aCommit" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-commit)" stopOpacity="0.45"/><stop offset="1" stopColor="var(--c-commit)" stopOpacity="0.02"/></linearGradient>
        <linearGradient id="aBest"   x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-best)" stopOpacity="0.4"/><stop offset="1" stopColor="var(--c-best)" stopOpacity="0.02"/></linearGradient>
        <linearGradient id="aPipe"   x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-pipe)" stopOpacity="0.4"/><stop offset="1" stopColor="var(--c-pipe)" stopOpacity="0.02"/></linearGradient>
        <linearGradient id="aWon"    x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--c-won)" stopOpacity="0.4"/><stop offset="1" stopColor="var(--c-won)" stopOpacity="0.02"/></linearGradient>
      </defs>

      {quarters.map((q, i) => q.now && (
        <rect key="now" x={x0 + band * i} y={y0 - 6} width={band} height={plotH + 6}
          fill="var(--accent)" opacity="0.05" rx="10" />
      ))}

      {ticks.map(t => (
        <g key={t}>
          <line className="grid-line" x1={x0} x2={x1} y1={yS(t)} y2={yS(t)} />
          <text className="axis-label" x={x0 - 10} y={yS(t) + 4} textAnchor="end">{axisLabel(t)}</text>
        </g>
      ))}

      {style === 'columns' && quarters.map((q, i) => {
        const c = cx(i); const left = c - colW / 2;
        let acc = 0; const gap = 2.5;
        return (
          <g key={q.q} {...segHandlers(q)}>
            {SERIES.map((s, si) => {
              const v = q[s.key] || 0; if (v <= 0) return null;
              const yTop = yS(acc + v); const yBot = yS(acc); acc += v;
              const h = Math.max(0, yBot - yTop - gap);
              const isTop = SERIES.slice(si + 1).every(ss => q[ss.key] <= 0);
              return <rect key={s.key} className="col-seg" x={left} y={yTop} width={colW} height={h}
                rx={isTop ? 6 : 4} fill={`url(#g${s.key[0].toUpperCase()}${s.key.slice(1)})`} />;
            })}
            {q.target > 0 && <line className="target-line" x1={left - 6} x2={left + colW + 6} y1={yS(q.target)} y2={yS(q.target)} />}
            <text className="bar-total" x={c} y={yS(grand(q)) - 12} textAnchor="middle" fontSize="15">{fmt.money(grand(q))}</text>
          </g>
        );
      })}

      {style === 'stems' && quarters.map((q, i) => {
        const c = cx(i); let acc = 0; const sw = 13;
        return (
          <g key={q.q} {...segHandlers(q)}>
            {SERIES.map((s) => {
              const v = q[s.key] || 0; if (v <= 0) return null;
              const yTop = yS(acc + v); const yBot = yS(acc); acc += v;
              return <line key={s.key} className="col-seg" x1={c} x2={c} y1={yBot} y2={yTop + 1} stroke={s.color} strokeWidth={sw} strokeLinecap="round" />;
            })}
            {q.target > 0 && <line className="target-line" x1={c - 16} x2={c + 16} y1={yS(q.target)} y2={yS(q.target)} />}
            <circle cx={c} cy={yS(grand(q))} r="4.5" fill="var(--text)" />
            <text className="bar-total" x={c} y={yS(grand(q)) - 14} textAnchor="middle" fontSize="15">{fmt.money(grand(q))}</text>
          </g>
        );
      })}

      {style === 'area' && (() => {
        const order = ['pipe', 'best', 'commit', 'won'];
        let baseline = quarters.map(() => 0);
        const layers = [];
        order.forEach((key) => {
          const top = quarters.map((q, i) => baseline[i] + (q[key] || 0));
          layers.push({ key, top: top.slice(), base: baseline.slice() });
          baseline = top;
        });
        const lineP = (arr) => arr.map((v, i) => `${i === 0 ? 'M' : 'L'} ${cx(i)} ${yS(v)}`).join(' ');

        const cap = (k) => k[0].toUpperCase() + k.slice(1);
        return (
          <g>
            {layers.map(l => <path key={l.key} d={areaP(l)} fill={`url(#a${cap(l.key)})`} stroke="none" />)}

  );

function CoverageGauge({ value, max = 100, unit = '%', gaugeLabel = '', label, sublabel, subtext, onClick }) {
  const r = 62, c = 2 * Math.PI * r;
  const frac = Math.min(1, value / max);
  const dash = c * frac * 0.75;
  const arc  = c * 0.75;

    <div className={'gauge-wrap' + (onClick ? ' clickable' : '')} onClick={onClick}>

  <script type="text/babel">
const { useState: useStateP } = React;

/* ============================================================
   Shared filters — business type (New/Renewal), quarter focus and stage scope.
   These live in App and drive buildView(), so every page and widget reflects them.
   ============================================================ */
const FilterCtx = React.createContext(null);
const QUARTERS4 = ['Q1', 'Q2', 'Q3', 'Q4'];

/* buildView(raw, {quarter, stageScope, kind, carry, includeWon}) — derives the
   rendered view from the raw deal pool the proxy returns, applying the filters:
     • business type + stage scope filter the pool for every widget and page
     • FY scope: '2026 flights' (default) counts only revenue flighting inside
       calendar 2026 — deals running entirely in 2025/2027 are excluded, and
       straddling deals count only their in-year portion (matches the customer
       file). '+ 2025/27 carryover' folds pre-2026 revenue into Q1 and post-2026 into Q4.
     • quarter focus narrows the headline numbers, tables, stages, partners and
       channels to that quarter (values prorated by flight-day overlap), while the
       quarterly chart keeps all four bars with the focused quarter marked.
     • commit definition: 'open ≥80% only' (default) vs 'open + won'.
   Falls back to `raw` unchanged for the offline snapshot (no per-quarter alloc). */
function buildView(raw, f) {
  const deals = raw && raw.deals;
  if (!deals || !deals.length || !deals[0] || !deals[0].amountAlloc) return raw;  // offline snapshot
  const round = Math.round;
  const quarter = f.quarter || 'Full year';
  const stageScope = f.stageScope || 'All stages';
  const kind = f.kind || 'Both';
  const carry = !!f.carry;             // false = FY2026 only (default)
  const includeWon = !!f.includeWon;   // commit definition
  const isFull = quarter === 'Full year';
  const nowQ = (raw.quarters.find(q => q.now) || {}).q;
  const M = 1e6, K = 1e3;
  const money = (n) => Math.abs(n) >= M ? '$' + (n / M).toFixed(2).replace(/\.?0+$/, '') + 'M' : '$' + Math.round(n / K) + 'K';

  // Effective per-quarter maps under the FY scope. Carryover folds the explicit
  // pre/post buckets into Q1/Q4; FY-only drops them.
  const effQ = (m) => {
    m = m || {};
    return carry
      ? { Q1: (m.Q1 || 0) + (m.pre || 0), Q2: m.Q2 || 0, Q3: m.Q3 || 0, Q4: (m.Q4 || 0) + (m.post || 0) }
      : { Q1: m.Q1 || 0, Q2: m.Q2 || 0, Q3: m.Q3 || 0, Q4: m.Q4 || 0 };
  };
  const sum4 = (m) => m.Q1 + m.Q2 + m.Q3 + m.Q4;

  // 1) business-type + stage-scope + FY-scope — apply to the whole pool
  const passKind = d => kind === 'Both' || (d.dealType || 'New') === kind;
  const passStage = d => stageScope !== 'Qualified' || d.band !== 'Outreach' || !d.open;  // Qualified drops cold open Leads
  const passFY = d => carry || d.fyTouch !== false;   // FY-only: drop deals entirely outside 2026
  const basePool = deals.filter(d => passKind(d) && passStage(d) && passFY(d))
    .map(d => ({ ...d, _w: effQ(d.alloc), _a: effQ(d.amountAlloc) }));

  // 2) value projection. Deals with no dates at all allocate nowhere but still
  // belong to the full-year totals (their alloc maps are all-zero).
  const dateless = d => !d.flightStart && !d.closeDate;
  const wOf = d => isFull ? (dateless(d) ? d.weighted : sum4(d._w)) : d._w[quarter];
  const aOf = d => isFull ? (dateless(d) ? d.amount   : sum4(d._a)) : d._a[quarter];
  const touches = d => isFull || d._w[quarter] || d._a[quarter];
  const scoped = basePool.filter(touches).map(d => ({ ...d, weighted: round(wOf(d)), amount: round(aOf(d)) }));
  // tables/drills show the filtered set with original deal sizes but view-consistent quarter maps
  const dealSet = basePool.filter(touches).map(d => {
    const { _w, _a, ...rest } = d;
    return { ...rest, alloc: { Q1: round(_w.Q1), Q2: round(_w.Q2), Q3: round(_w.Q3), Q4: round(_w.Q4) },
             amountAlloc: { Q1: round(_a.Q1), Q2: round(_a.Q2), Q3: round(_a.Q3), Q4: round(_a.Q4) } };
  });

  const OPEN = scoped.filter(d => d.open);
  const WON  = scoped.filter(d => d.status === 'Won');
  const weighted = OPEN.reduce((s, d) => s + d.weighted, 0);
  const pipeline = OPEN.reduce((s, d) => s + d.amount, 0);
  const wonAmt   = WON.reduce((s, d) => s + d.amount, 0);
  const wonW     = WON.reduce((s, d) => s + d.weighted, 0);
  const commitOpen = OPEN.filter(d => d.probability >= 80);
  const commitDeals = includeWon ? [...commitOpen, ...WON] : commitOpen;
  const commitAmt = commitDeals.reduce((s, d) => s + d.amount, 0);
  const commitW   = commitDeals.reduce((s, d) => s + d.weighted, 0);
  const totalForecast = weighted + wonW;
  const commitRate = includeWon
    ? (totalForecast ? round(commitW / totalForecast * 100) : 0)
    : (weighted ? round(commitW / weighted * 100) : 0);
  const weightedPct = pipeline ? round(weighted / pipeline * 100) : 0;
  const noValueCount = OPEN.filter(d => !d.amount).length;

  // 3) quarterly chart — always the full four-quarter breakdown of the filtered pool
  const qi = () => ({ commit: 0, best: 0, pipe: 0, won: 0 });
  const Q = { Q1: qi(), Q2: qi(), Q3: qi(), Q4: qi() };
  for (const d of basePool) {
    if (d.open) { const t = d.tier || 'pipe'; for (const k of QUARTERS4) Q[k][t] += d._w[k]; }
    else if (d.status === 'Won') { for (const k of QUARTERS4) Q[k].won += d._a[k]; }
  }
  const quarters = QUARTERS4.map(q => ({
    q, commit: round(Q[q].commit), best: round(Q[q].best), pipe: round(Q[q].pipe), won: round(Q[q].won),
    total: round(Q[q].commit + Q[q].best + Q[q].pipe),
    ...(q === nowQ ? { now: true } : {}),
    ...(!isFull && q === quarter ? { focus: true } : {}),
  }));

  // 4) stages (open, scoped)
  const stageColor = { 'Media Plan/Proposal': 'var(--c-best)', 'IO/Contract': 'var(--c-commit)', 'Expected Renewal': 'var(--c-best)' };
  const stageOrder = ['Lead', 'Discovery/Pitch', 'Media Plan/Proposal', 'Expected Renewal', 'IO/Contract'];
  const stageAgg = {};
  for (const d of OPEN) { const s = d.stage || 'Unknown'; (stageAgg[s] ||= { count: 0, weighted: 0, total: 0 }); stageAgg[s].count++; stageAgg[s].weighted += d.weighted; stageAgg[s].total += d.amount; }
  const stages = Object.entries(stageAgg)
    .sort((a, b) => { const ia = stageOrder.indexOf(a[0]), ib = stageOrder.indexOf(b[0]); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); })
    .map(([name, v]) => ({ name, count: v.count, weighted: round(v.weighted), total: round(v.total), color: stageColor[name] || 'var(--c-pipe)' }));

  // 5) partners (open, scoped) — top 5 + residual "Other"
  const pAgg = {};
  for (const d of OPEN) { const p = d.partner || 'Unassigned'; (pAgg[p] ||= { deals: 0, weighted: 0 }); pAgg[p].deals++; pAgg[p].weighted += d.weighted; }
  const ranked = Object.entries(pAgg).map(([name, v]) => ({ name, deals: v.deals, weighted: round(v.weighted) })).sort((a, b) => b.weighted - a.weighted);
  const top = ranked.filter(p => p.weighted > 0).slice(0, 5);
  const knownWeighted = top.reduce((s, p) => s + p.weighted, 0);
  const knownDeals = top.reduce((s, p) => s + p.deals, 0);
  const residualDeals = OPEN.length - knownDeals;
  const partners = residualDeals > 0
    ? [...top, { name: 'Other partners', deals: residualDeals, weighted: Math.max(0, round(weighted) - knownWeighted), derived: true }]
    : top;
  const top3Share = weighted ? round(top.slice(0, 3).reduce((s, p) => s + p.weighted, 0) / weighted * 100) : 0;
  const topPartner = top[0] || { name: '—', weighted: 0 };
  const topShare = weighted ? round(topPartner.weighted / weighted * 100) : 0;
  const bestUpside = round(OPEN.filter(d => d.tier === 'best').reduce((s, d) => s + d.weighted, 0));
  const pipeUpside = round(OPEN.filter(d => d.tier === 'pipe').reduce((s, d) => s + d.weighted, 0));
  const chartSum = quarters.reduce((s, q) => s + q.total, 0);
  const peakQ = [...quarters].sort((a, b) => b.total - a.total)[0] || { q: '—', total: 0 };
  const peakShare = chartSum ? round(peakQ.total / chartSum * 100) : 0;

  // 6) sales channel
  const channelOrder = raw.channelOrder || ['Direct Ad Sales', 'Channel Sales', 'Enhanced Affiliate'];
  const channelMix = (pool, metric) => {
    const agg = {};
    for (const d of pool) {
      const ch = d.channel || 'Unassigned';
      (agg[ch] ||= { name: ch, deals: 0, value: 0, clients: {} });
      agg[ch].deals++; agg[ch].value += metric(d);
      const cn = d.partner || 'Unassigned';
      (agg[ch].clients[cn] ||= { name: cn, deals: 0, value: 0 });
      agg[ch].clients[cn].deals++; agg[ch].clients[cn].value += metric(d);
    }
    const ord = n => { const i = channelOrder.indexOf(n); return i < 0 ? 99 : i; };
    return Object.entries(agg).map(([name, v]) => ({
      name, deals: v.deals, value: round(v.value),
      clients: Object.values(v.clients).map(x => ({ ...x, value: round(x.value) })).sort((a, b) => b.value - a.value || b.deals - a.deals || a.name.localeCompare(b.name)),
    })).sort((a, b) => ord(a.name) - ord(b.name) || b.value - a.value);
  };
  const channelsOpen = channelMix(OPEN, d => d.weighted);
  const channelsBooked = channelMix(WON, d => d.amount);

  // 7) insights — recomputed so the shown math matches the filtered figures
  const kindNote = kind === 'Both' ? '' : ` · ${kind.toLowerCase()} business only`;
  const scopeNote = stageScope === 'Qualified' ? ' · qualified only' : '';
  const insights = [
    { tone: 'flag', icon: 'layers', title: `${topPartner.name} drives ${topShare}% of weighted revenue`,
      body: `${topPartner.name} accounts for <b class="hl">${money(topPartner.weighted)}</b> of the ${money(weighted)} weighted forecast — high single-partner concentration.`,
      calc: `${money(topPartner.weighted)} ÷ ${money(weighted)} = ${topShare}%   ·   top-3 share = ${top3Share}%` },
    { tone: 'plain', icon: 'spark', title: `${peakQ.q} carries ${peakShare}% of the weighted pipeline`,
      body: `<b class="hl">${money(peakQ.total)}</b> of the weighted forecast closes in ${peakQ.q}. Commit (≥80% + won) totals <b class="hl">${money(commitAmt)}</b>.`,
      calc: `best-case upside = ${money(bestUpside)}   ·   early pipeline = ${money(pipeUpside)}` },
    includeWon
      ? { tone: 'good', icon: 'target', title: `${money(commitAmt)} committed (≥80% + won)`,
          body: `${commitDeals.length} deals (${commitOpen.length} open ≥ 80% + ${WON.length} won) carry <b class="hl">${money(commitAmt)}</b> — <b class="hl">${commitRate}%</b> of the total forecast.`,
          calc: `${money(commitW)} weighted commit ÷ ${money(totalForecast)} total = ${commitRate}%   ·   won = ${money(wonAmt)}` }
      : { tone: 'good', icon: 'target', title: `${money(commitAmt)} committed (open deals ≥ 80%)`,
          body: `${commitOpen.length} open deals at ≥ 80% probability carry <b class="hl">${money(commitAmt)}</b> — <b class="hl">${commitRate}%</b> of the weighted forecast. Booked revenue is counted separately.`,
          calc: `${money(commitW)} weighted commit ÷ ${money(weighted)} weighted = ${commitRate}%   ·   booked (separate) = ${money(wonAmt)}` },
    { tone: 'flag', icon: 'alert', title: `${noValueCount} open deals have no dollar value`,
      body: `${noValueCount} of ${OPEN.length} open deals have no amount entered — invisible to the weighted forecast until priced.`,
      calc: `${noValueCount} ÷ ${OPEN.length} = ${OPEN.length ? round(noValueCount / OPEN.length * 100) : 0}% unpriced   ·   blended probability = ${weightedPct}%` },
  ];
  if (wonAmt > 0) insights.splice(2, 0, {
    tone: 'good', icon: 'up', title: `${money(wonAmt)} booked${isFull ? ' in ' + raw.fy : ' in ' + quarter}`,
    body: `${WON.length} closed-won deals recognise <b class="hl">${money(wonAmt)}</b> of booked revenue${kindNote}${scopeNote}. Booked sits outside the open forecast.`,
    calc: `booked = ${money(wonAmt)}   ·   weighted + booked = ${money(weighted + wonAmt)}` });

  // 8) kpis + totals (scoped)
  const kpis = {
    weighted: { value: round(weighted), label: 'Weighted forecast', sub: `of ${money(pipeline)} ${isFull ? 'total' : quarter} pipeline`, accent: 'var(--accent)' },
    commit:   { value: round(commitAmt), label: 'Commit',
      sub: includeWon ? `${commitOpen.length} open ≥ 80% + ${WON.length} won` : `${commitOpen.length} open deals at ≥ 80% probability`,
      accent: 'var(--c-commit)' },
    openPipe: { value: round(pipeline), label: 'Open pipeline', sub: `${OPEN.length} open deals`, accent: 'var(--c-pipe)' },
    booked:   { value: round(wonAmt), label: 'Booked', sub: `${WON.length} closed-won deals`, accent: 'var(--c-won)' },
  };
  const totals = {
    ...raw.totals,
    unweighted: round(pipeline), weightedRaw: round(weighted), totalDeals: OPEN.length,
    commitAmount: round(commitAmt), commitWeighted: round(commitW), commitRate,
    commitCount: commitDeals.length, commitOpenCount: commitOpen.length,
    wonCount: WON.length, wonAmount: round(wonAmt), wonWeighted: round(wonW),
    totalForecast: round(totalForecast), weightedPlusBooked: round(weighted + wonAmt),
    top3Share, bestUpside, pipeUpside, weightedPct, knownWeighted,
  };

  return {
    ...raw, deals: dealSet, kpis, quarters, stages, partners, insights,
    channelsOpen, channelsBooked, channelOrder, totals,
    quarter, stageScope, kind, quarterScoped: !isFull, carry, includeWon,
  };
}

/* ---- quarterly revenue goals, shared + persistent (Cloudflare D1) ----
   The CRM has no quota, so goals are user-entered. They live server-side in
   our own D1 store (via /api/goals), so every viewer sees the same numbers and
   they survive reloads. Writes hit OUR store only — never the CRM. */
function useGoals(fy) {
  const [goals, setGoals] = React.useState({});
  const [status, setStatus] = React.useState('loading'); // loading | ready | saving | error
  const goalsRef = React.useRef(goals);
  goalsRef.current = goals;

  // Load the shared goals for this fiscal year on mount / fy change.
  React.useEffect(() => {
    let alive = true;
    setStatus('loading');
    fetch('api/goals?fy=' + encodeURIComponent(fy), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { if (!alive) return; if (d && !d.error) { setGoals(d.goals || {}); setStatus('ready'); } else setStatus('error'); })
      .catch(() => { if (alive) setStatus('error'); });
    return () => { alive = false; };
  }, [fy]);

  const setGoal = (q, raw) => {
    const n = Math.round(Number(String(raw).replace(/[^0-9.]/g, '')) || 0);
    const next = { ...goalsRef.current };
    if (n > 0) next[q] = n; else delete next[q];
    if (JSON.stringify(next) === JSON.stringify(goalsRef.current)) return; // no-op
    setGoals(next);            // optimistic
    setStatus('saving');
    fetch('api/goals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fy, goals: next }),
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { if (d && !d.error) { setGoals(d.goals || {}); setStatus('ready'); } else setStatus('error'); })
      .catch(() => setStatus('error'));
  };

  const entered = ['Q1', 'Q2', 'Q3', 'Q4'].filter(q => goals[q] > 0);
  const fyTarget = entered.reduce((s, q) => s + goals[q], 0);
  return { goals, setGoal, fyTarget, enteredCount: entered.length, status };
}

function GoalEditor({ goals, setGoal, enteredCount, fyTarget, status }) {
  const saveTag = status === 'saving' ? { t: 'Saving…', c: 'var(--faint)' }
    : status === 'error' ? { t: 'Save failed', c: 'var(--c-risk)' }
    : status === 'loading' ? { t: 'Loading…', c: 'var(--faint)' }
    : { t: 'Saved', c: 'var(--c-commit)' };
  const busy = status === 'loading';
  return (
    <div style={{ marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
      <div className="between" style={{ marginBottom: 8 }}>
        <span className="faint" style={{ fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', fontWeight: 700 }}>Set quarterly goals</span>
        <span className="faint" style={{ fontSize: 11.5 }}>{enteredCount} of 4 entered{fyTarget ? ' · FY ' + fmt.money(fyTarget) : ''}</span>
      </div>
      <div style={{ display: 'flex', gap: 8, opacity: busy ? 0.5 : 1 }}>
        {['Q1', 'Q2', 'Q3', 'Q4'].map(q => (
          <label key={q + '-' + (goals[q] || 0)} style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 4 }}>
            <span className="faint" style={{ fontSize: 10, letterSpacing: '.06em' }}>{q}</span>
            <input className="goal-input" type="text" inputMode="numeric" defaultValue={goals[q] || ''} placeholder="$0" disabled={busy}
              onBlur={e => setGoal(q, e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
          </label>
        ))}
      </div>
      <div className="between" style={{ marginTop: 6 }}>
        <span className="faint" style={{ fontSize: 10.5 }}>Shared across everyone. Saved to the dashboard, not your browser.</span>
        <span style={{ fontSize: 10.5, fontWeight: 700, color: saveTag.c }}>{saveTag.t}</span>
      </div>
    </div>
  );
}

function ChannelMix({ open, booked }) {
  const [mode, setMode] = React.useState('open');
  const data = (mode === 'booked' ? booked : open) || [];
  const max = Math.max(1, ...data.map(c => c.value));
  const chColor = { 'Direct Ad Sales': 'var(--accent)', 'Channel Sales': 'var(--c-pipe)', 'Enhanced Affiliate': 'var(--c-won)' };
  return (
    <div>
      <div className="dt-toolbar" style={{ marginBottom: 12 }}>
        <div className="seg-mini">
          <button className={mode === 'open' ? 'on' : ''} onClick={() => setMode('open')}>Open (weighted)</button>
          <button className={mode === 'booked' ? 'on' : ''} onClick={() => setMode('booked')}>Booked (won)</button>
        </div>
      </div>
      <div className="conc">
        {data.length === 0 && <div className="faint" style={{ padding: '10px 0', fontSize: 13 }}>No {mode === 'booked' ? 'booked' : 'open'} deals.</div>}
        {data.map((c, i) => (
          <div className="conc-row" key={c.name}>
            <span className="conc-rank">{String(i + 1).padStart(2, '0')}</span>
            <div style={{ minWidth: 0 }}>
              <div className="conc-name">{c.name}</div>
              <div className="conc-sub">{c.deals} deals{c.clients && c.clients.length ? ' · ' + c.clients.length + (c.clients.length === 1 ? ' client' : ' clients') : ''}</div>
              <div className="conc-track"><div className="conc-fill" style={{ width: (c.value / max * 100) + '%', background: chColor[c.name] || 'var(--accent)' }}></div></div>
            </div>
            <span className="conc-val num">{fmt.money(c.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
